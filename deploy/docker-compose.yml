# Home Assistant + Mosquitto (MQTT) + the PV curtailment controller/refresh for the smart_home Pi.
#   cd deploy && docker compose up -d
# All use host networking: HA/mosquitto share localhost:1883, and the controller additionally
# needs wlan0 (the inverter's own Wi-Fi AP, 192.168.200.1:6607) and the LAN (P1 meter).
#
# Explicit project `name:` -- both this repo and home-automation name their deploy dir "deploy",
# which without this collides on Compose's default (directory-basename) project name and risks
# `docker compose down`/`up` here reaching into home-automation's containers instead of just
# this repo's services.
name: smart-home
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    network_mode: host
    restart: unless-stopped
    # Make these the last things the kernel kills when the host runs out of memory.
    #
    # This box also runs unrelated and much hungrier workloads. If one exhausts RAM the OOM
    # killer picks a victim by score, and with everything left at the default 0 there is
    # nothing telling it to spare home automation. A negative oom_score_adj does. Learned
    # from a real host-wide memory exhaustion on 2026-08-24, where the kernel killed a
    # browser while the actual multi-GB offender sat at 0 and survived untouched.
    #
    # Deliberately no mem_limit on these two: they are small and steady, and killing them
    # for sitting at a ceiling is precisely the outcome this is meant to prevent. Caps
    # belong on the workloads that can actually run away, not on the ones you need alive.
    #
    # NOTE: oom_score_adj is fixed at container creation. `docker update` cannot change it
    # and `docker restart` reuses the old value -- only a recreate applies an edit here.
    oom_score_adj: -800
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    restart: unless-stopped
    # See mosquitto above.
    oom_score_adj: -800
    environment:
      - TZ=Europe/Brussels
    volumes:
      - ./ha-config:/config
    depends_on:
      - mosquitto

  # Write-capable, switch-gated controller -- the always-on production service. Sole Modbus
  # client to the inverter, so this and `publisher` must never run at the same time (see
  # `publisher`'s profile below). Profile-gated (like publisher) so a bare `docker compose up -d`
  # -- the exact command this file's own header documents for bringing up HA/mosquitto -- can
  # never accidentally start a second Modbus client alongside a still-running native
  # smart_home-controller.service; the systemd unit that manages this targets it by explicit
  # service name (`docker compose up -d controller`), which starts it regardless of profile.
  controller:
    build: ..
    image: smart-home-controller
    container_name: smart_home-controller
    network_mode: host
    restart: unless-stopped
    profiles: ["controller"]
    # Memory containment. Steady state is ~16 MB, so 512m is ~30x headroom -- sized as a
    # runaway detector, not a constraint. This service has never been the problem; the cap
    # is here so it cannot become one.
    #
    # `memswap_limit` must stay equal to `mem_limit`: that is what disables swap for this
    # cgroup, and it is the load-bearing half. With swap available a runaway degrades into
    # hours of disk thrash rather than dying quickly, and on this host the thrash is what
    # turned a memory exhaustion into a seven-hour freeze. Do not remove it as redundant.
    #
    # Negative oom_score_adj, but above mosquitto/HA (-800): losing curtailment stops the
    # inverter being throttled, which is real but recoverable via `restart: unless-stopped`.
    # Losing MQTT or HA takes the whole house down with it.
    mem_limit: 512m
    memswap_limit: 512m
    oom_score_adj: -500
    # run as the host solarpi user (uid/gid 1000) -- the state dir (~/.smart_home) and its
    # files are solarpi-owned; running as root here would flip their ownership and could then
    # deny the native systemd units that read/write the same path (found while testing `refresh`
    # below, which shares this same state dir).
    user: "1000:1000"
    environment:
      - HOME=/home/solarpi
      - P1_HOST
      - HUAWEI_USER
      - HUAWEI_PW
      - MQTT_HOST
      - MQTT_PORT
      - MQTT_USER
      - MQTT_PW
      - NODE_ID
    volumes:
      - /home/solarpi/.smart_home:/home/solarpi/.smart_home
    command: ["smart_home.controller", "--p1-host", "${P1_HOST}"]

  # Dry-run monitoring-only variant (never writes to the inverter) -- the pre-actuation setup
  # this repo's README describes, or a manual fallback if `controller` needs to come down without
  # losing telemetry. Not started by `docker compose up -d` (no `controller`+`publisher` running
  # together -- single Modbus client): `docker compose --profile publisher up -d publisher`.
  publisher:
    build: ..
    image: smart-home-controller
    container_name: smart_home-publisher
    network_mode: host
    restart: unless-stopped
    profiles: ["publisher"]
    # Same shape as `controller` above -- same image, same footprint, and the two are
    # mutually exclusive, so they get identical limits.
    mem_limit: 512m
    memswap_limit: 512m
    oom_score_adj: -500
    user: "1000:1000"
    environment:
      - HOME=/home/solarpi
      - P1_HOST
      - MQTT_USER
      - MQTT_PW
      - NODE_ID
    volumes:
      - /home/solarpi/.smart_home:/home/solarpi/.smart_home
    command: ["smart_home.controller", "--p1-host", "${P1_HOST}", "--mqtt-host", "localhost", "--dry-run"]

  # Oneshot daily day-ahead refresh -- invoked by smart_home-refresh.timer via
  # `docker compose run --rm refresh`, not left running. Profile-gated for the same reason as
  # `controller`/`publisher`: keeps it out of a bare `docker compose up -d`. `run` targets it by
  # explicit name, which bypasses the profile gate.
  refresh:
    build: ..
    image: smart-home-controller
    network_mode: host
    profiles: ["refresh"]
    user: "1000:1000"
    environment:
      - HOME=/home/solarpi
      - ENTSOE_API_TOKEN
      - MQTT_HOST
      - MQTT_PORT
      - MQTT_USER
      - MQTT_PW
      - NODE_ID
    volumes:
      - /home/solarpi/.smart_home:/home/solarpi/.smart_home
    command: ["smart_home.schedule", "refresh", "--wait-tomorrow"]

volumes:
  mosquitto-data:
